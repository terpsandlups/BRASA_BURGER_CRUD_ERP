name: Validar ERP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  postgres-nativo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: senha-sintetica-somente-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:postgres
        env:
          POSTGRES_TEST_URL: postgresql://postgres:senha-sintetica-somente-ci@127.0.0.1:5432/postgres

  api-supabase-isolada:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TEST_WORKDIR: /tmp/convivium-supabase
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Instalar CLI fixado
        run: |
          npm install --prefix "$RUNNER_TEMP/convivium-cli" --no-save supabase@2.117.0
          echo "$RUNNER_TEMP/convivium-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Iniciar stack descartavel
        run: |
          mkdir -p "$SUPABASE_TEST_WORKDIR"
          supabase init --workdir "$SUPABASE_TEST_WORKDIR"
          supabase start --workdir "$SUPABASE_TEST_WORKDIR" --exclude studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,postgres-meta,edge-runtime > "$RUNNER_TEMP/convivium-stack.log" 2>&1
      - name: Homologar Auth, API, pedido e estoque
        run: node scripts/verificar-supabase-local.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: resultado-api-local
          path: docs/entrega-02/anexos/resultado-api-local.json
          retention-days: 30
      - name: Encerrar stack descartavel
        if: always()
        run: supabase stop --workdir "$SUPABASE_TEST_WORKDIR" --no-backup
